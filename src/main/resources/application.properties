
spring.application.name=uniFex
server.port=7676
spring.datasource.url=jdbc:postgresql://localhost:5433/bd_fexpo_produccion
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.thymeleaf.cache=false

app.upload-root=${UNIFEX_UPLOAD_ROOT:/var/lib/unifex/uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=${UNIFEX_TMP_DIR:/var/lib/unifex/tmp}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

unifex.admin.admin1-password=${ADMIN1_PASSWORD}
unifex.admin.admin2-password=${ADMIN2_PASSWORD}


pasarela.url=${PASARELA_URL:https://pasarela.uap.edu.bo/v1/pago/nuevo}
pasarela.key=${PASARELA_KEY:}
pasarela.successUrl=${PASARELA_SUCCESS_URL:}
pasarela.cancelUrl=${PASARELA_CANCEL_URL:}
pasarela.notifyUrl=${PASARELA_NOTIFY_URL:}

server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For

api.key=${API_KEY}

unifex.reserva.ttl-segundos=300
unifex.reserva.barrido-ms=30000

# Fase 2: JWT para el API movil/SPA
unifex.jwt.secret=${JWT_SECRET}
unifex.jwt.expiration-ms=86400000

unifex.nota.verificacion-url=${NOTA_VERIFICACION_URL:}


whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api.url=${WHATSAPP_API_URL:}
whatsapp.api.key=${WHATSAPP_API_KEY:}
whatsapp.instance=${WHATSAPP_INSTANCE:}

# URL publica para enlaces dentro del mensaje de WhatsApp y QR de credenciales.
app.base-url=${UNIFEX_PUBLICO_BASE_URL:http://localhost:7676}
unifex.publico.base-url=${UNIFEX_PUBLICO_BASE_URL:}
